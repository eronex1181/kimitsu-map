<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimitsu / Chiba Field Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">

<style>
html,body{height:100%;margin:0}
#map{height:100%;background:#f3f3f3}
.leaflet-control-layers{max-height:78vh;overflow:auto}
.map-icon{
 font-size:18px;width:30px;height:30px;line-height:30px;text-align:center;
 background:white;border-radius:50%;border:2px solid #333;
 box-shadow:0 2px 5px rgba(0,0,0,.3)
}
.city-label{
 background:transparent;border:none;box-shadow:none;color:#37474f;
 font-size:12px;font-weight:bold;
 text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 0 4px #fff;
 white-space:nowrap
}
.search-tag{
 display:inline-block;margin:6px;padding:2px 8px;border-radius:999px;
 font-size:12px;color:#fff;background:#e53935;font-weight:bold;white-space:nowrap
}
#coord{
 position:absolute;
 z-index:1000;
 left:10px;
 bottom:36px;
 background:rgba(255,255,255,.92);
 padding:4px 7px;
 border-radius:4px;
 font-size:12px;
 line-height:1.2;
 pointer-events:none;
}

#pointinfo{
 position:absolute;
 z-index:1001;
 left:10px;
 bottom:62px;
 max-width:min(390px,calc(100vw - 24px));
 background:rgba(255,255,255,.96);
 border:1px solid #bbb;
 box-shadow:0 1px 5px rgba(0,0,0,.25);
 border-radius:6px;
 padding:7px 9px;
 font-size:12px;
 line-height:1.55;
 display:none;
}
#pointinfo{
 -webkit-user-select:text;
 user-select:text;
 cursor:text;
}
#pointinfo .point-title{font-weight:700;margin-bottom:2px}
#pointinfo .point-address{word-break:break-word}
#pointinfo .point-coord{font-family:monospace;color:#333}
#pointinfo .point-note{font-size:10px;color:#777;margin-top:2px}

#pointinfo .plane-coord{
 margin-top:4px;
 font-family:monospace;
 color:#333;
}


/* 左下の距離スケールを見やすく表示 */
.leaflet-control-scale{
 margin-left:10px !important;
 margin-bottom:8px !important;
}
.leaflet-control-scale-line{
 background:rgba(255,255,255,.92);
 color:#222;
 border-color:#555;
 border-top:none;
 font-size:12px;
 line-height:1.2;
 padding:2px 6px 1px;
 box-sizing:border-box;
}
.legend-box{
 background:rgba(255,255,255,.95);padding:8px 10px;border-radius:5px;
 box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:12px;line-height:20px
}
.legend-swatch{
 display:inline-block;width:18px;height:12px;margin-right:6px;vertical-align:-1px;border:2px solid
}

.leaflet-facility-pane{
 pointer-events:none !important;
}
.leaflet-facility-pane .leaflet-marker-icon,
.leaflet-facility-pane .marker-cluster{
 pointer-events:auto !important;
 cursor:pointer;
}

.locate-control{
 background:#fff;
 width:38px;
 height:38px;
 border-radius:4px;
 box-shadow:0 1px 5px rgba(0,0,0,.35);
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 font-size:20px;
 user-select:none;
}
.locate-control:hover{background:#f4f4f4}
.locate-control.active{background:#e3f2fd}
.locate-dot{
 width:16px;height:16px;border-radius:50%;
 background:#1976d2;border:3px solid #fff;
 box-shadow:0 0 0 2px #1976d2,0 1px 5px rgba(0,0,0,.45);
}

</style>
</head>
<body>
<div id="map"></div>
<div id="coord"></div>
<div id="pointinfo"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://maps.gsi.go.jp/js/muni.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

<script>
// 千葉県全体
const map=L.map('map',{preferCanvas:true,maxZoom:19}).setView([35.50,140.13],9);

map.createPane('csPane');       map.getPane('csPane').style.zIndex=410;

// 地質図は背景として使い、クリックを邪魔しない専用Pane
map.createPane('geologyPane');
map.getPane('geologyPane').style.zIndex=415;
map.getPane('geologyPane').style.pointerEvents='none';

map.createPane('hazardPane');   map.getPane('hazardPane').style.zIndex=420;
map.createPane('boundaryPane'); map.getPane('boundaryPane').style.zIndex=425;
map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex=430;

// バス停・避難場所等の施設アイコンは土砂災害区域より上に表示。
// Pane自体はクリック透過し、アイコン／クラスタだけ pointer-events:auto。
// そのため、アイコンは施設ポップアップ、その他の場所は下の土砂災害区域をクリックできる。
map.createPane('facilityPane');
map.getPane('facilityPane').style.zIndex=452;
map.getPane('facilityPane').style.pointerEvents='none';

map.createPane('dosyaPane');     map.getPane('dosyaPane').style.zIndex=440;

// 国土基本図1/2500図郭
map.createPane('zukakuPane');
map.getPane('zukakuPane').style.zIndex=447;

// 青い今回対象は「見た目だけ」の専用Pane。
// Pane全体でマウスイベントを無効化するため、クリックは必ず下の黄/赤レイヤーへ通る。
map.createPane('highlightPane');
map.getPane('highlightPane').style.zIndex=445;
map.getPane('highlightPane').style.pointerEvents='none';

map.createPane('markersPane');   map.getPane('markersPane').style.zIndex=450;

// 背景
const gsiPale=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
 {maxZoom:18,attribution:'© 国土地理院'}
).addTo(map);

const gsiStd=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
 {maxZoom:18,attribution:'© 国土地理院'}
);

const gsiPhoto=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
 {maxZoom:18,attribution:'© 国土地理院'}
);

// 今昔マップ 関東
const konjaku00=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/00/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku01=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/01/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku02=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/02/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku03=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/03/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);

// 君津1mDEM由来CS（君津周辺のみ）
const kimitsuBounds=[[35.1662899944,139.8749059525],[35.3336791683,140.1256305681]];
const cs=L.tileLayer('./tiles/cs/{z}/{x}/{y}.webp',{
 minZoom:10,maxNativeZoom:16,maxZoom:19,opacity:.70,bounds:kimitsuBounds,pane:'csPane',
 attribution:'CS立体図：国土地理院DEM1Aを加工'
});


// =====================================================
// 産総研 地質調査総合センター（GSJ） 地質図
// 20万分の1：日本シームレス地質図V2
// =====================================================

// 20万分の1 日本シームレス地質図V2
const geology200k=L.tileLayer.wms(
 'https://ows.gsj.jp/ows/seamlessv2',
 {
   layers:'seamlessV2_poly,seamlessV2_line,seamlessV2_poly_label',
   format:'image/png',
   transparent:true,
   version:'1.1.1',
   pane:'geologyPane',
   opacity:.68,
   attribution:'20万分の1日本シームレス地質図V2：産総研 GSJ'
 }
);

// 水害6レイヤー
const floodL2=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const houseFlood=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png',
 {minZoom:4,maxNativeZoom:17,maxZoom:19,opacity:.75,pane:'hazardPane',attribution:'© 国土地理院'}
);
const houseErosion=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png',
 {minZoom:4,maxNativeZoom:17,maxZoom:19,opacity:.75,pane:'hazardPane',attribution:'© 国土地理院'}
);
const inlandFlood=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const stormSurge=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const tsunami=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);

const baseMaps={
 '国土地理院（淡色）':gsiPale,
 '国土地理院（標準）':gsiStd,
 '国土地理院（航空写真）':gsiPhoto,
 '今昔マップ 関東（1894～1915年）':konjaku00,
 '今昔マップ 関東（1928～1945年）':konjaku01,
 '今昔マップ 関東（1972～1982年）':konjaku02,
 '今昔マップ 関東（1988～2008年）':konjaku03
};

const overlays={
 '地質図 1/20万（シームレスV2・GSJ）':geology200k,
 '君津CS立体図（1m DEM）':cs,
 '① 洪水浸水想定区域（想定最大規模）':floodL2,
 '② 家屋倒壊等氾濫想定区域（氾濫流）':houseFlood,
 '③ 家屋倒壊等氾濫想定区域（河岸侵食）':houseErosion,
 '④ 内水（雨水出水）浸水想定区域':inlandFlood,
 '⑤ 高潮浸水想定区域':stormSurge,
 '⑥ 津波浸水想定':tsunami
};

let ctl=L.control.layers(baseMaps,overlays,{collapsed:false}).addTo(map);

L.control.scale({position:'bottomleft',metric:true,imperial:false,maxWidth:150}).addTo(map);

// =====================================================
// 国土基本図 1/2500 図郭（千葉県）
// GeoJSONはWGS84（EPSG:4326）へ変換済み。
// 初期OFF。ONでグレー枠表示、クリック／タップで図郭番号。
// =====================================================
let zukaku2500Layer=null;

fetch('./chiba_kodokihonzu_2500.json',{cache:'no-store'})
.then(r=>{
  if(!r.ok)throw new Error(`chiba_kodokihonzu_2500.json HTTP ${r.status}`);
  return r.json();
})
.then(data=>{
  zukaku2500Layer=L.geoJSON(data,{
    pane:'zukakuPane',
    style:{
      color:'#777',
      weight:1,
      opacity:.90,
      fillColor:'#ffffff',
      fillOpacity:.001
    },
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      const code=p.sheet_code||p.SHEET_CODE||p.code||p.CODE||'不明';

      l.bindPopup(
        `<div style="font-size:13px;line-height:1.6;min-width:130px">`+
        `<b>国土基本図 1/2500</b><br>`+
        `図郭番号：<b>${esc(code)}</b>`+
        `</div>`,
        {maxWidth:260}
      );

      l.bindTooltip(`図郭番号：${esc(code)}`,{
        sticky:true,direction:'top',opacity:.95
      });

      l.on({
        mouseover:e=>{
          e.target.setStyle({color:'#555',weight:2,opacity:1,fillOpacity:.015});
          if(e.target.bringToFront)e.target.bringToFront();
        },
        mouseout:e=>{
          if(zukaku2500Layer)zukaku2500Layer.resetStyle(e.target);
        }
      });
    }
  });

  ctl.addOverlay(zukaku2500Layer,'国土基本図 1/2500 図郭');
  console.log(`千葉県 国土基本図1/2500図郭：${data.features?.length||0}図郭を読込完了`);
})
.catch(err=>console.error('千葉県 国土基本図1/2500図郭の読み込みに失敗:',err));

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function makePopup(title,props,latlng){
 let rows=Object.entries(props||{}).map(([k,v])=>{
   if(v===null||v===undefined||String(v).trim()===''||k==='_searchKey')return '';
   return `<tr>
     <th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left">${esc(k)}</th>
     <td style="border-bottom:1px solid #ccc">${esc(v)}</td>
   </tr>`;
 }).join('');

 let btn='';
 if(latlng){
   const lat=latlng.lat,lng=latlng.lng;
   btn=`<div style="margin-top:10px;display:flex;gap:6px">
     <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank"
      style="flex:1;text-align:center;background:#4285F4;color:#fff;padding:5px;border-radius:4px;text-decoration:none;font-size:11px">Googleマップ</a>
     <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank"
      style="flex:1;text-align:center;background:#ea4335;color:#fff;padding:5px;border-radius:4px;text-decoration:none;font-size:11px">ストリートビュー</a>
   </div>`;
 }
 return `<b>${esc(title)}</b><br>
 <div style="max-height:220px;overflow:auto">
 <table style="border-collapse:collapse;font-size:12px">${rows}</table>
 </div>${btn}`;
}


function mapLinkButtons(latlng){
 if(!latlng)return '';
 const lat=Number(latlng.lat);
 const lng=Number(latlng.lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return '';

 const google=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
 const street=`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;

 return `<div style="margin:8px 0 10px;display:flex;gap:6px">
   <a href="${google}" target="_blank" rel="noopener"
    style="flex:1;text-align:center;background:#4285F4;color:#fff;padding:7px 5px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:700">Googleマップ</a>
   <a href="${street}" target="_blank" rel="noopener"
    style="flex:1;text-align:center;background:#EA4335;color:#fff;padding:7px 5px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:700">ストリートビュー</a>
 </div>`;
}

function hazardPopupHtml(p,latlng){
 const phenomenonCode=Number(p?.A33_001);
 const phenomenon=
   phenomenonCode===1 ? '急傾斜地の崩壊' :
   phenomenonCode===2 ? '土石流' :
   phenomenonCode===3 ? '地滑り' :
   '不明';

 const rows=[
   ['現象の種類', phenomenon],
   ['箇所番号', p?.A33_004 ?? ''],
   ['箇所名', p?.A33_005 ?? ''],
   ['公示年月日', p?.A33_007 ?? '']
 ].map(([k,v])=>`<tr>
   <th style="white-space:nowrap;padding:5px 10px 5px 0;border-bottom:1px solid #ccc;text-align:left">${esc(k)}</th>
   <td style="padding:5px 0;border-bottom:1px solid #ccc">${esc(v)}</td>
 </tr>`).join('');

 return `<div style="max-height:220px;overflow:auto">
          <table style="border-collapse:collapse;font-size:12px">${rows}</table>
         </div>`+
        mapLinkButtons(latlng);
}


// -----------------------------------------------------
// バス停・避難場所：見やすい日本語ポップアップ
// -----------------------------------------------------
function popupTable(rows){
  const body=rows
    .filter(([k,v])=>v!==null && v!==undefined && String(v).trim()!=='')
    .map(([k,v])=>`<tr>
      <th style="white-space:nowrap;padding:5px 10px 5px 0;border-bottom:1px solid #ddd;text-align:left;vertical-align:top">${esc(k)}</th>
      <td style="padding:5px 0;border-bottom:1px solid #ddd">${v}</td>
    </tr>`).join('');
  return `<table style="border-collapse:collapse;font-size:12px;width:100%">${body}</table>`;
}

function busClassName(code){
  return ({
    '1':'路線バス（民間）',
    '2':'路線バス（公営）',
    '3':'コミュニティバス',
    '4':'デマンドバス',
    '5':'その他'
  })[String(code??'').trim()] || '';
}

function busStopPopup(p,latlng){
  const routeKeys=Object.keys(p||{}).filter(k=>/^P11_003_\d+$/.test(k)).sort();
  const classKeys=Object.keys(p||{}).filter(k=>/^P11_004_\d+$/.test(k)).sort();

  const routes=routeKeys
    .map(k=>p[k])
    .filter(v=>v!==null && v!==undefined && String(v).trim()!=='')
    .map(v=>esc(String(v).trim()));

  const classes=[];
  classKeys.forEach(k=>{
    const raw=p[k];
    if(raw===null || raw===undefined || String(raw).trim()==='') return;
    String(raw).split(',').forEach(code=>{
      const name=busClassName(code);
      if(name && !classes.includes(name)) classes.push(name);
    });
  });

  const rows=[
    ['バス停名', esc(p?.P11_001||'')],
    ['バス事業者名', esc(p?.P11_002||'')],
    ['バス系統', routes.join('<br>')],
    ['バス区分', classes.map(esc).join('、')],
    ['備考', esc(p?.P11_005||'')]
  ];

  return `<b>バス停</b>`+
    popupTable(rows)+
    `<div style="margin-top:6px;color:#666;font-size:10px">出典：国土数値情報 バス停留所データ（令和4年）</div>`+
    mapLinkButtons(latlng);
}

function evacuationPopup(p,latlng){
  const disasterFields=[
    ['洪水','洪水'],
    ['崖崩れ、土石流及び地滑り','崖崩れ・土石流・地滑り'],
    ['高潮','高潮'],
    ['地震','地震'],
    ['津波','津波'],
    ['大規模な火事','大規模な火事'],
    ['内水氾濫','内水氾濫'],
    ['火山現象','火山現象']
  ];

  const hazards=disasterFields
    .filter(([key])=>{
      const v=p?.[key];
      return v!==null && v!==undefined && String(v).trim()!=='' && String(v).trim()!=='0';
    })
    .map(([,label])=>label);

  const sameAddress=String(p?.['指定避難所との住所同一']??'').trim();
  const sameText=sameAddress==='1' ? '指定避難所と同一住所' :
                 sameAddress==='' ? '' : esc(sameAddress);

  const rows=[
    ['施設・場所名', esc(p?.['施設・場所名']||'')],
    ['住所', esc(p?.['住所']||'')],
    ['対応する災害', hazards.map(esc).join('、')],
    ['指定避難所', sameText],
    ['備考', esc(p?.['備考']||'')]
  ];

  return `<b>避難場所・指定緊急避難場所</b>`+
    popupTable(rows)+
    `<div style="margin-top:6px;color:#666;font-size:10px">出典：国土地理院</div>`+
    mapLinkButtons(latlng);
}

async function loadBusStops(){
  try{
    const r=await fetch('./data/bus_stops.geojson',{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const gj=await r.json();

    const geo=L.geoJSON(gj,{
      pane:'facilityPane',
      pointToLayer:(f,ll)=>L.marker(ll,{
        pane:'facilityPane',
        interactive:true,
        bubblingMouseEvents:false,
        icon:L.divIcon({
          html:`<div class="map-icon" style="color:#1565c0"><i class="fa-solid fa-bus"></i></div>`,
          className:'',iconSize:[30,30],iconAnchor:[15,15]
        })
      }),
      onEachFeature:(f,l)=>{
        l.bindPopup(

function locateMe(buttonEl){
  if(!navigator.geolocation){
    alert('この端末・ブラウザでは位置情報を利用できません。');
    return;
  }

  buttonEl.classList.add('active');
  buttonEl.innerHTML='…';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude;
      const lng=pos.coords.longitude;
      const acc=pos.coords.accuracy || 0;
      const ll=L.latLng(lat,lng);

      if(currentLocationMarker) map.removeLayer(currentLocationMarker);
      if(currentAccuracyCircle) map.removeLayer(currentAccuracyCircle);

      currentAccuracyCircle=L.circle(ll,{
        radius:acc,
        color:'#1976d2',
        weight:1.5,
        opacity:.7,
        fillColor:'#64b5f6',
        fillOpacity:.12,
        interactive:false
      }).addTo(map);

      currentLocationMarker=L.marker(ll,{
        pane:'markersPane',
        zIndexOffset:1000,
        icon:L.divIcon({
          className:'',
          html:'<div class="locate-dot"></div>',
          iconSize:[22,22],
          iconAnchor:[11,11]
        })
      }).addTo(map);

      currentLocationMarker.bindPopup(
        `<b>現在地</b><br>`+
        `緯度: ${lat.toFixed(6)}<br>`+
        `経度: ${lng.toFixed(6)}<br>`+
        `位置精度: 約${Math.round(acc)}m`
      );

      map.setView(ll,Math.max(map.getZoom(),16));
      currentLocationMarker.openPopup();

      buttonEl.classList.remove('active');
      buttonEl.innerHTML='◎';
    },
    err=>{
      buttonEl.classList.remove('active');
      buttonEl.innerHTML='◎';

      let msg='現在地を取得できませんでした。';
      if(err.code===1) msg+=' 位置情報の利用を許可してください。';
      else if(err.code===2) msg+=' 端末が現在地を特定できませんでした。';
      else if(err.code===3) msg+=' 位置情報の取得がタイムアウトしました。';

      alert(msg);
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:10000
    }
  );
}

function normalizeMuniCode(code){
  const s=String(code??'').replace(/\D/g,'');
  if(!s)return '';
  return s.padStart(5,'0');
}

function prefCodeFromMuni(code){
  const s=normalizeMuniCode(code);
  return s.length>=2 ? s.slice(0,2) : '';
}

function municipalityPartsFromCode(code){
  const prefCode=prefCodeFromMuni(code);
  const fallbackPref=PREF_CODE_NAME[prefCode]||'';

  try{
    const raw=window.GSI?.MUNI_ARRAY?.[String(code)] ||
              window.GSI?.MUNI_ARRAY?.[normalizeMuniCode(code)];
    if(raw){
      const parts=String(raw).split(',');
      return {
        pref:parts[1]||fallbackPref,
        muni:parts[3]||'',
        prefCode
      };
    }
  }catch(e){}

  // muni.jsが使えなくても都道府県名だけは手書き表から返す。
  return {pref:fallbackPref,muni:'',prefCode};
}

function planeSystemFromPrefCode(prefCode,lat,lng){
  // 北海道：経度でXI・XII・XIIIを判定する簡易手書きフォールバック
  if(prefCode==='01'){
    if(lng < 141.5)return 11;
    if(lng < 143.5)return 12;
    return 13;
  }

  // 東京都：本土はIX系、島しょ部は位置で分岐
  if(prefCode==='13'){
    if(lat >= 33.5)return 9;
    if(lng >= 150)return 19;
    if(lat < 24)return 18;
    return 14;
  }

  // 鹿児島県：本土はII系、一部島しょ部はI系
  if(prefCode==='46'){
    const islandZone1=(lat>=27 && lat<=32 && lng>=128.3 && lng<=130.3);
    return islandZone1 ? 1 : 2;
  }

  // 沖縄県：西側XVI、中央XV、東側XVII
  if(prefCode==='47'){
    if(lng < 126)return 16;
    if(lng > 130)return 17;
    return 15;
  }

  return PREF_CODE_PLANE[prefCode] || null;
}

// 逆ジオコーダが市区町村コードを返さない場合の位置フォールバック。
// 特にこの千葉県Web地図では、千葉県域なら確実にIX系とする。
function planeSystemFromLatLngFallback(lat,lng){
  // 千葉県のおおよその範囲
  if(lat>=34.8 && lat<=36.3 && lng>=139.7 && lng<=141.0)return 9;

  // 石川・富山周辺
  if(lat>=35.8 && lat<=37.9 && lng>=136.0 && lng<=138.0)return 7;

  // 長野周辺
  if(lat>=35.0 && lat<=37.2 && lng>=137.3 && lng<=139.2)return 8;

  // 北海道
  if(lat>=41.3 && lat<=45.8){
    if(lng<141.5)return 11;
    if(lng<143.5)return 12;
    return 13;
  }

  return null;
}

function toPlaneRect(lat,lng,systemNo){
  if(!window.proj4 || !systemNo)return null;
  const sys=PLANE_SYSTEMS[systemNo];
  if(!sys)return null;

  try{
    // proj4は [Easting, Northing] を返す。
    // 日本の平面直角座標は X=北方向、Y=東方向。
    const [easting,northing]=proj4('EPSG:4326',sys.epsg,[lng,lat]);
    if(!Number.isFinite(easting)||!Number.isFinite(northing))return null;
    return {
      systemNo,
      roman:sys.roman,
      epsg:sys.epsg,
      x:northing,
      y:easting
    };
  }catch(e){
    console.warn('平面直角座標変換に失敗:',e);
    return null;
  }
}

function renderPointInfo(panel,info,addressText,note=''){
  const plane=info.plane;
  const planeHtml=plane
    ? `<div class="plane-coord">平面直角座標 第${plane.roman}系（JGD2011）<br>`+
      `X：${plane.x.toFixed(3)} m<br>`+
      `Y：${plane.y.toFixed(3)} m</div>`
    : `<div class="plane-coord">平面直角座標：系番号を判定できません</div>`;

  panel.innerHTML=
    `<div class="point-title">クリック地点</div>`+
    `<div class="point-address">住所：${addressText}</div>`+
    `<div class="point-coord">緯度：${info.lat.toFixed(7)}<br>経度：${info.lng.toFixed(7)}</div>`+
    planeHtml+
    (note ? `<div class="point-note">${note}</div>` : '');
}

async function showClickedPointInfo(latlng){
  if(!latlng)return;

  const panel=document.getElementById('pointinfo');
  if(!panel)return;

  const lat=Number(latlng.lat);
  const lng=Number(latlng.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;

  const seq=++pointInfoSeq;

  // 住所取得前でも、位置フォールバックで先に系番号を出せるようにする。
  let fallbackSystem=planeSystemFromLatLngFallback(lat,lng);
  let fallbackPlane=toPlaneRect(lat,lng,fallbackSystem);

  lastPointInfo={
    lat,lng,plane:fallbackPlane,address:'',pref:'',muni:''
  };

  panel.style.display='block';
  renderPointInfo(
    panel,
    lastPointInfo,
    '取得中…',
    fallbackPlane
      ? `平面直角座標：位置から第${fallbackPlane.roman}系を仮判定`
      : '住所取得後に平面直角座標系を判定します'
  );

  try{
    const url=
      `https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();

    if(seq!==pointInfoSeq)return;

    const result=j?.results||{};
    const parts=municipalityPartsFromCode(result.muniCd);
    const town=String(result.lv01Nm||'').trim();

    // muni.jsが使えない場合でも「千葉県山之郷」のように都道府県名は表示可能。
    const address=`${parts.pref}${parts.muni}${town}`.trim();

    let systemNo=planeSystemFromPrefCode(parts.prefCode,lat,lng);
    if(!systemNo)systemNo=planeSystemFromLatLngFallback(lat,lng);

    const plane=toPlaneRect(lat,lng,systemNo);

    lastPointInfo.address=address;
    lastPointInfo.pref=parts.pref;
    lastPointInfo.muni=parts.muni;
    lastPointInfo.plane=plane;

    const planeNote=plane
      ? `平面直角座標系：第${plane.roman}系（${plane.epsg}）`
      : '平面直角座標系を判定できませんでした';

    renderPointInfo(
      panel,
      lastPointInfo,
      address ? esc(address) : (town ? esc(town) : '住所情報なし'),
      `住所：国土地理院リバースジオコーダ ／ ${planeNote}`
    );
  }catch(err){
    if(seq!==pointInfoSeq)return;

    // 住所取得失敗時も、位置フォールバックでXYは残す。
    renderPointInfo(
      panel,
      lastPointInfo,
      '取得できませんでした',
      lastPointInfo.plane
        ? `住所取得失敗 ／ 平面直角座標は位置から第${lastPointInfo.plane.roman}系を判定`
        : '住所・平面直角座標系を判定できませんでした'
    );
    console.warn('住所の逆ジオコーディングに失敗:',err);
  }
}

// 各レイヤー側で stopPropagation されても地点を拾えるよう、
// DOMのcapture段階でクリック位置を取得する。
// レイヤー操作ボタン・ポップアップ内部は除外。
map.getContainer().addEventListener('click',ev=>{
  const target=ev.target;
  if(target?.closest?.('.leaflet-control,.leaflet-popup,.leaflet-tooltip,#pointinfo'))return;

  try{
    const latlng=map.mouseEventToLatLng(ev);
    showClickedPointInfo(latlng);
  }catch(e){}
},true);

// 座標
map.on('mousemove',e=>{
 document.getElementById('coord').textContent=
 `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}  Z${map.getZoom()}`;
});

// 地図上の区域・施設クリックでは各レイヤーの属性ポップアップを優先します。
// 座標は左下に常時表示されるため、地図クリック時の座標ポップアップは出しません。
</script>
</body>
</html>
