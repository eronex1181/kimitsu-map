<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimitsu / Chiba Field Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">

<style>
html,body{height:100%;margin:0}
#map{height:100%;background:#f3f3f3}
.leaflet-control-layers{max-height:78vh;overflow:auto}
.map-icon{
 font-size:18px;width:30px;height:30px;line-height:30px;text-align:center;
 background:white;border-radius:50%;border:2px solid #333;
 box-shadow:0 2px 5px rgba(0,0,0,.3)
}
.city-label{
 background:transparent;border:none;box-shadow:none;color:#37474f;
 font-size:12px;font-weight:bold;
 text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 0 4px #fff;
 white-space:nowrap
}
.search-tag{
 display:inline-block;margin:6px;padding:2px 8px;border-radius:999px;
 font-size:12px;color:#fff;background:#e53935;font-weight:bold;white-space:nowrap
}
#coord{
 position:absolute;z-index:1000;left:10px;bottom:10px;
 background:rgba(255,255,255,.9);padding:4px 7px;border-radius:4px;font-size:12px
}
.legend-box{
 background:rgba(255,255,255,.95);padding:8px 10px;border-radius:5px;
 box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:12px;line-height:20px
}
.legend-swatch{
 display:inline-block;width:18px;height:12px;margin-right:6px;vertical-align:-1px;border:2px solid
}
</style>
</head>
<body>
<div id="map"></div>
<div id="coord"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
// 千葉県全体
const map=L.map('map',{preferCanvas:true,maxZoom:19}).setView([35.50,140.13],9);

map.createPane('csPane');       map.getPane('csPane').style.zIndex=410;
map.createPane('hazardPane');   map.getPane('hazardPane').style.zIndex=420;
map.createPane('boundaryPane'); map.getPane('boundaryPane').style.zIndex=425;
map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex=430;
map.createPane('dosyaPane');     map.getPane('dosyaPane').style.zIndex=440;

// 青い今回対象は「見た目だけ」の専用Pane。
// Pane全体でマウスイベントを無効化するため、クリックは必ず下の黄/赤レイヤーへ通る。
map.createPane('highlightPane');
map.getPane('highlightPane').style.zIndex=445;
map.getPane('highlightPane').style.pointerEvents='none';

map.createPane('markersPane');   map.getPane('markersPane').style.zIndex=450;

// 背景
const gsiPale=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
 {maxZoom:18,attribution:'© 国土地理院'}
).addTo(map);

const gsiStd=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
 {maxZoom:18,attribution:'© 国土地理院'}
);

const gsiPhoto=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
 {maxZoom:18,attribution:'© 国土地理院'}
);

// 今昔マップ 関東
const konjaku00=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/00/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku01=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/01/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku02=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/02/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);
const konjaku03=L.tileLayer(
 'https://ktgis.net/kjmapw/kjtilemap/kanto/03/{z}/{x}/{-y}.png',
 {minZoom:8,maxNativeZoom:15,maxZoom:19,attribution:'© 今昔マップ on the web'}
);

// 君津1mDEM由来CS（君津周辺のみ）
const kimitsuBounds=[[35.1662899944,139.8749059525],[35.3336791683,140.1256305681]];
const cs=L.tileLayer('./tiles/cs/{z}/{x}/{y}.webp',{
 minZoom:10,maxNativeZoom:16,maxZoom:19,opacity:.70,bounds:kimitsuBounds,pane:'csPane',
 attribution:'CS立体図：国土地理院DEM1Aを加工'
});

// 水害6レイヤー
const floodL2=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const houseFlood=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png',
 {minZoom:4,maxNativeZoom:17,maxZoom:19,opacity:.75,pane:'hazardPane',attribution:'© 国土地理院'}
);
const houseErosion=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png',
 {minZoom:4,maxNativeZoom:17,maxZoom:19,opacity:.75,pane:'hazardPane',attribution:'© 国土地理院'}
);
const inlandFlood=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const stormSurge=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);
const tsunami=L.tileLayer(
 'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:17,maxZoom:19,opacity:.70,pane:'hazardPane',attribution:'© 国土地理院'}
);

const baseMaps={
 '国土地理院（淡色）':gsiPale,
 '国土地理院（標準）':gsiStd,
 '国土地理院（航空写真）':gsiPhoto,
 '今昔マップ 関東（1894～1915年）':konjaku00,
 '今昔マップ 関東（1928～1945年）':konjaku01,
 '今昔マップ 関東（1972～1982年）':konjaku02,
 '今昔マップ 関東（1988～2008年）':konjaku03
};

const overlays={
 '君津CS立体図（1m DEM）':cs,
 '① 洪水浸水想定区域（想定最大規模）':floodL2,
 '② 家屋倒壊等氾濫想定区域（氾濫流）':houseFlood,
 '③ 家屋倒壊等氾濫想定区域（河岸侵食）':houseErosion,
 '④ 内水（雨水出水）浸水想定区域':inlandFlood,
 '⑤ 高潮浸水想定区域':stormSurge,
 '⑥ 津波浸水想定':tsunami
};

let ctl=L.control.layers(baseMaps,overlays,{collapsed:window.innerWidth<650}).addTo(map);
L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function makePopup(title,props,latlng){
 let rows=Object.entries(props||{}).map(([k,v])=>{
   if(v===null||v===undefined||String(v).trim()===''||k==='_searchKey')return '';
   return `<tr>
     <th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left">${esc(k)}</th>
     <td style="border-bottom:1px solid #ccc">${esc(v)}</td>
   </tr>`;
 }).join('');

 let btn='';
 if(latlng){
   const lat=latlng.lat,lng=latlng.lng;
   btn=`<div style="margin-top:10px;display:flex;gap:6px">
     <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank"
      style="flex:1;text-align:center;background:#4285F4;color:#fff;padding:5px;border-radius:4px;text-decoration:none;font-size:11px">Googleマップ</a>
     <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank"
      style="flex:1;text-align:center;background:#ea4335;color:#fff;padding:5px;border-radius:4px;text-decoration:none;font-size:11px">ストリートビュー</a>
   </div>`;
 }
 return `<b>${esc(title)}</b><br>
 <div style="max-height:220px;overflow:auto">
 <table style="border-collapse:collapse;font-size:12px">${rows}</table>
 </div>${btn}`;
}


function mapLinkButtons(latlng){
 if(!latlng)return '';
 const lat=Number(latlng.lat);
 const lng=Number(latlng.lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return '';

 const google=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
 const street=`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;

 return `<div style="margin:8px 0 10px;display:flex;gap:6px">
   <a href="${google}" target="_blank" rel="noopener"
    style="flex:1;text-align:center;background:#4285F4;color:#fff;padding:7px 5px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:700">Googleマップ</a>
   <a href="${street}" target="_blank" rel="noopener"
    style="flex:1;text-align:center;background:#EA4335;color:#fff;padding:7px 5px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:700">ストリートビュー</a>
 </div>`;
}

function hazardPopupHtml(zoneName,p,latlng){
 let rows=Object.entries(p||{}).map(([k,v])=>{
   if(v===null||v===undefined||String(v).trim()===''||k==='_searchKey')return '';
   return `<tr>
     <th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left">${esc(k)}</th>
     <td style="border-bottom:1px solid #ccc">${esc(v)}</td>
   </tr>`;
 }).join('');

 return `<b>${esc(zoneName)}</b>`+
        mapLinkButtons(latlng)+
        `<div style="max-height:220px;overflow:auto">
           <table style="border-collapse:collapse;font-size:12px">${rows}</table>
         </div>`;
}

// 点レイヤー
async function loadPointLayer(file,name,iconHtml,iconColor){
 try{
   const r=await fetch(file,{cache:'no-store'});
   if(!r.ok)throw new Error(r.status);
   const gj=await r.json();

   const geo=L.geoJSON(gj,{
     pane:'markersPane',
     pointToLayer:(f,ll)=>L.marker(ll,{icon:L.divIcon({
       html:`<div class="map-icon" style="color:${iconColor}">${iconHtml}</div>`,
       className:'',iconSize:[30,30],iconAnchor:[15,15]
     })}),
     onEachFeature:(f,l)=>l.bindPopup(makePopup(name,f.properties,l.getLatLng()))
   });

   const cluster=L.markerClusterGroup({
     disableClusteringAtZoom:15,
     showCoverageOnHover:false
   });
   cluster.addLayer(geo);
   ctl.addOverlay(cluster,name);
 }catch(e){
   console.error(name,e);
 }
}

// 面レイヤー
async function loadPolygonLayer(file,name,style){
 try{
   const r=await fetch(file,{cache:'no-store'});
   if(!r.ok)throw new Error(r.status);
   const gj=await r.json();

   const layer=L.geoJSON(gj,{
     pane:'zonesPane',
     style:()=>style,
     onEachFeature:(f,l)=>{
       const center=l.getBounds?l.getBounds().getCenter():null;
       l.bindPopup(makePopup(name,f.properties,center));
     }
   });
   ctl.addOverlay(layer,name);
 }catch(e){
   console.error(name,e);
 }
}

// 千葉県全域データ
loadPointLayer(
 './data/evacuation.geojson',
 '避難所・指定緊急避難場所（千葉県全域）',
 '<i class="fa-solid fa-person-running"></i>',
 '#2e7d32'
);

loadPointLayer(
 './data/bus_stops.geojson',
 'バス停（千葉県全域）',
 '<i class="fa-solid fa-bus"></i>',
 '#1565c0'
);

loadPolygonLayer(
 './data/embankment_regulation.geojson',
 '盛土規制区域（千葉県全域）',
 {color:'#d84315',weight:2,fillColor:'#ff7043',fillOpacity:.20}
);

loadPolygonLayer(
 './data/sabo_designated.geojson',
 '砂防指定地（千葉県全域）',
 {color:'#1565c0',weight:2,fillColor:'#42a5f5',fillOpacity:.24}
);

loadPolygonLayer(
 './data/landslide_prevention.geojson',
 '地すべり防止区域（千葉県全域）',
 {color:'#7b1fa2',weight:2,fillColor:'#ab47bc',fillOpacity:.24}
);

loadPolygonLayer(
 './data/steep_slope_danger.geojson',
 '急傾斜地崩壊危険区域（千葉県全域）',
 {color:'#c62828',weight:2,fillColor:'#ef5350',fillOpacity:.28}
);


// 今回対象6箇所。
// GeoJSONの「今回対象」属性が欠けていても、箇所番号または箇所名で確実に判定する。
const TARGET_CODES=new Set([
 'Ⅲ-0675',      // 黄和田畑1
 'Ⅱ-6089',      // 大坂1
 'Ⅱ-6688',      // 金谷4
 'Ⅱ-6099',      // 芋窪1
 'Ⅱ-6428',      // 亀沢32
 'Ⅰ-22500701'   // 四ノ宮沢
]);

const TARGET_NAMES=new Set([
 '黄和田畑1',
 '大坂1',
 '金谷4',
 '芋窪1',
 '亀沢32',
 '四ノ宮沢'
]);

function isCurrentTarget(p){
 const flag=String(p?.['今回対象']??'').trim();
 const code=String(p?.A33_004??'').trim();
 const name=String(p?.A33_005??'').trim();

 return flag!=='' || TARGET_CODES.has(code) || TARGET_NAMES.has(name);
}

// =====================================================
// 土砂災害警戒区域 / 特別警戒区域
// A33_002 = 1 → イエローゾーン
// A33_002 = 2 → レッドゾーン
// 「今回対象」が入っている6箇所 → 水色で強調
// =====================================================
let dosyaLayer=null;

fetch('./A33-25_12Polygon.geojson',{cache:'no-store'})
.then(r=>{
 if(!r.ok)throw new Error(`A33-25_12Polygon.geojson HTTP ${r.status}`);
 return r.json();
})
.then(data=>{

 dosyaLayer=L.geoJSON(data,{
   pane:'dosyaPane',
   bubblingMouseEvents:false,

   style:f=>{
     const p=f.properties||{};
     const zone=Number(p.A33_002);

     if(zone===1){
       return {
         color:'#c9a900',
         weight:1.3,
         opacity:.95,
         fillColor:'#ffff00',
         fillOpacity:.42
       };
     }

     if(zone===2){
       return {
         color:'#b00020',
         weight:1.5,
         opacity:.95,
         fillColor:'#ff0000',
         fillOpacity:.48
       };
     }

     return {
       color:'#777',
       weight:1,
       fillColor:'#aaa',
       fillOpacity:.20
     };
   },

   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     const zone=Number(p.A33_002);

     const zoneName=zone===1
       ? '土砂災害警戒区域（イエローゾーン）'
       : zone===2
         ? '土砂災害特別警戒区域（レッドゾーン）'
         : '土砂災害区域';

     const num=p.A33_004||'';
     const nm=p.A33_005||'';
     const addr=p.A33_006||p.A33_009||'';

     p._searchKey=`${num} ${nm} ${addr}`.trim();

     // 検索から開いた場合に備えた初期ポップアップ
     const center=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(hazardPopupHtml(zoneName,p,center),{
       maxWidth:430,
       minWidth:300
     });

     // 実際にクリックした地点でGoogle/Street Viewリンクを作り直す
     l.on('click',e=>{
       if(e.originalEvent){
         L.DomEvent.stopPropagation(e.originalEvent);
       }
       const clicked=e.latlng || center;
       l.setPopupContent(hazardPopupHtml(zoneName,p,clicked));
       l.openPopup(clicked);
     });

     l.on({
       mouseover:e=>{
         e.target.setStyle({weight:4,fillOpacity:.65});
         if(e.target.bringToFront)e.target.bringToFront();
       },
       mouseout:e=>{
         dosyaLayer.resetStyle(e.target);
       }
     });
   }
 }).addTo(map);

 ctl.addOverlay(
   dosyaLayer,
   '土砂災害警戒区域・特別警戒区域（2025年）'
 );

 // 箇所番号・箇所名・住所検索
 const searchCtrl=new L.Control.Search({
   layer:dosyaLayer,
   propertyName:'_searchKey',
   textPlaceholder:'箇所番号 / 箇所名 / 住所',
   marker:false,
   zoom:16,
   collapsed:window.innerWidth<650,
   initial:false
 }).addTo(map);

 searchCtrl.on('search:locationfound',e=>{
   if(e.layer.getBounds){
     map.fitBounds(e.layer.getBounds(),{
       maxZoom:17,
       padding:[24,24]
     });
   }
   if(e.layer.openPopup)e.layer.openPopup();
 });

 const el=searchCtrl._container||searchCtrl.getContainer();
 const tag=document.createElement('span');
 tag.className='search-tag';
 tag.textContent='⚠️ 土砂災害検索';
 (el.querySelector('form')||el).insertBefore(tag,el.firstChild);

})
.catch(err=>{
 console.error('土砂災害区域の読み込みに失敗:',err);
});


// =====================================================
// 今回対象の既指定箇所調査（6箇所）：別GeoJSONレイヤー（青色）
// 本体の土砂災害区域は通常の黄色/赤色のまま。
// このレイヤーをONにした時だけ既指定箇所調査6箇所を青で重ねて表示。
// 青レイヤー自身はクリックを受けず、下の黄色/赤色レイヤーへクリックを通します。
// =====================================================
fetch('./data/chiba_current_6targets.geojson',{cache:'no-store'})
.then(r=>{
 if(!r.ok)throw new Error(`chiba_current_6targets.geojson HTTP ${r.status}`);
 return r.json();
})
.then(data=>{
 const current6=L.geoJSON(data,{
   pane:'highlightPane',
   interactive:false,
   bubblingMouseEvents:false,
   style:{
     color:'#0057B8',
     weight:4,
     opacity:1,
     fillColor:'#00A8FF',
     fillOpacity:.50
   },
   onEachFeature:(f,l)=>{
     l.once('add',()=>{
       const el=l.getElement && l.getElement();
       if(el) el.style.pointerEvents='none';
     });
   }
 });

 // 初期OFF。チェックした時だけ青で重ねる。
 ctl.addOverlay(current6,'今回対象の既指定箇所調査（6箇所）');
 console.log('今回対象6箇所：クリック透過の青ハイライトとして読込完了');
})
.catch(err=>console.error('今回対象の既指定箇所調査（6箇所）の読込に失敗:',err));

// 旧市町村境界（1920年）
async function loadHistoricalAdmin(){
 const remote='https://geoshape.ex.nii.ac.jp/city/topojson/19200101/12/12_city.f.topojson';
 let gj=null;

 try{
   const r=await fetch(remote,{cache:'force-cache'});
   if(!r.ok)throw new Error(r.status);

   const topo=await r.json();
   const objKey=Object.keys(topo.objects)[0];
   gj=topojson.feature(topo,topo.objects[objKey]);

 }catch(e){
   console.warn('旧市町村全県版を取得できないためローカル版へ切替',e);

   const r=await fetch('./data/historical_admin.geojson',{cache:'no-store'});
   if(r.ok)gj=await r.json();
 }

 if(!gj)return;

 const labels=L.layerGroup();

 const layer=L.geoJSON(gj,{
   pane:'boundaryPane',
   style:{
     color:'#546e7a',
     weight:1.2,
     fillColor:'#90a4ae',
     fillOpacity:.07
   },

   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     const center=l.getBounds?l.getBounds().getCenter():null;

     l.bindPopup(
       makePopup(
         '旧市町村境界（1920年）',
         p,
         center
       )
     );

     const nm=
       p.name||
       p.N03_004||
       p.city||
       p.city1||
       p['市区町村名']||
       '';

     if(center&&nm){
       L.marker(center,{
         interactive:false,
         icon:L.divIcon({
           className:'city-label',
           html:esc(nm),
           iconSize:null
         })
       }).addTo(labels);
     }
   }
 });

 const group=L.layerGroup([layer,labels]);

 ctl.addOverlay(
   group,
   '旧市町村境界（1920年・千葉県全域）'
 );
}
