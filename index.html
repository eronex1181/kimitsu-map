<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>君津周辺 防災・地形Webマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#title{position:absolute;z-index:1000;left:10px;top:10px;background:rgba(255,255,255,.92);padding:8px 11px;border-radius:6px;box-shadow:0 1px 5px #888;font-weight:700;font-size:15px}
#coord{position:absolute;z-index:1000;left:10px;bottom:10px;background:rgba(255,255,255,.9);padding:4px 7px;border-radius:4px;font-size:12px}
.leaflet-control-layers{max-height:72vh;overflow:auto}
.popup table{border-collapse:collapse;font-size:12px}.popup th,.popup td{padding:2px 4px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.popup th{white-space:nowrap}
</style>
</head>
<body>
<div id="map"></div><div id="title">君津周辺 防災・地形Webマップ</div><div id="coord"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const bounds=[[35.1662899944,139.8749059525],[35.3336791683,140.1256305681]];
const map=L.map('map',{preferCanvas:true,maxZoom:19}); map.fitBounds(bounds);
const gsiStd=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',maxZoom:18});
const gsiPale=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'国土地理院',maxZoom:18});
const gsiPhoto=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{attribution:'国土地理院',maxZoom:18});
gsiStd.addTo(map);
const cs=L.tileLayer('./tiles/cs/{z}/{x}/{y}.webp',{minZoom:10,maxNativeZoom:17,maxZoom:19,opacity:.88,bounds:bounds,attribution:'CS立体図：国土地理院 DEM1A を加工'}).addTo(map);
const overlays={'CS立体図（1m DEM）':cs};
const bases={'地理院地図 標準':gsiStd,'地理院地図 淡色':gsiPale,'地理院写真':gsiPhoto};
const styles={
 evacuation:{label:'指定緊急避難場所等',point:{radius:5,fillColor:'#1677ff',color:'#fff',weight:1,fillOpacity:.9}},
 bus_stops:{label:'バス停',point:{radius:3,fillColor:'#f59e0b',color:'#fff',weight:1,fillOpacity:.9}},
 sabo_designated:{label:'砂防指定地',style:{color:'#1967d2',weight:2,fillColor:'#4da3ff',fillOpacity:.22}},
 landslide_prevention:{label:'地すべり防止区域',style:{color:'#7e22ce',weight:2,fillColor:'#a855f7',fillOpacity:.22}},
 steep_slope_danger:{label:'急傾斜地崩壊危険区域',style:{color:'#d93025',weight:2,fillColor:'#ef4444',fillOpacity:.25}},
 embankment_regulation:{label:'盛土規制区域',style:{color:'#8a4b08',weight:2,fillColor:'#f59e0b',fillOpacity:.15}},
 historical_admin:{label:'旧行政区域（参考）',style:{color:'#555',weight:1,dashArray:'5,4',fillOpacity:.03}}
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function popupHtml(p){
 const preferred=['name','city','location','address','operator','route','date','notice','hazard_landslide','zone_code','start','end'];
 let rows=''; for(const k of preferred){if(p[k]!==undefined && p[k]!==null && String(p[k]).trim()!=='') rows+=`<tr><th>${esc(k)}</th><td>${esc(p[k])}</td></tr>`;}
 return `<div class="popup"><table>${rows}</table></div>`;
}
async function loadLayer(id,file,enabled){
 const cfg=styles[id]; const r=await fetch(file); const gj=await r.json();
 const layer=L.geoJSON(gj,{style:cfg.style,pointToLayer:(f,ll)=>L.circleMarker(ll,cfg.point),onEachFeature:(f,l)=>l.bindPopup(popupHtml(f.properties||{}))});
 overlays[cfg.label]=layer; if(enabled) layer.addTo(map); layerControl.remove(); layerControl=L.control.layers(bases,overlays,{collapsed:false}).addTo(map);
}
let layerControl=L.control.layers(bases,overlays,{collapsed:false}).addTo(map);
loadLayer('evacuation','./data/evacuation.geojson',true);
loadLayer('bus_stops','./data/bus_stops.geojson',false);
loadLayer('sabo_designated','./data/sabo_designated.geojson',true);
loadLayer('landslide_prevention','./data/landslide_prevention.geojson',true);
loadLayer('steep_slope_danger','./data/steep_slope_danger.geojson',true);
loadLayer('embankment_regulation','./data/embankment_regulation.geojson',false);
loadLayer('historical_admin','./data/historical_admin.geojson',false);
map.on('mousemove',e=>document.getElementById('coord').textContent=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}  Z${map.getZoom()}`);
map.on('click',e=>L.popup().setLatLng(e.latlng).setContent(`${e.latlng.lat.toFixed(7)}, ${e.latlng.lng.toFixed(7)}`).openOn(map));
</script>
</body>
</html>
